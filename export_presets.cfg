[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="Assets/Audio/*.wav,Assets/Textures/*.png,Assets/Vanilla/*.json,Assets/Vanilla/models/*.json"
exclude_filter="artifacts/*,dist/*,.tools/*,tests/*,scripts/*,src/*,*.md"
export_path="dist/CozyCave/Cave.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
custom_template/debug=".tools/templates/templates/windows_debug_x86_64.exe"
custom_template/release=".tools/templates/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
